spring:
  application:
    name: cricket-live
  threads:
    virtual:
      enabled: true          # Tomcat + @Scheduled on virtual threads: cheap, plentiful SSE connections
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

cricket:
  admin-key: ""              # set to require X-API-Key on every write endpoint
  max-stored-matches: 200    # oldest completed matches are evicted beyond this
  demo-data: true            # seed a few matches at startup
  simulator:
    enabled: true
    tick-ms: 1500            # one delivery per live match per tick
    min-live-matches: 2      # keep the demo alive by spawning new matches (0 disables)
    new-match-overs: 10
