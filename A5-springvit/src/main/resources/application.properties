# ---------- Server ----------
server.port=8080

# ---------- MySQL (XAMPP) datasource ----------
# XAMPP's MySQL runs on localhost:3306 by default, user "root" with no password.
# createDatabaseIfNotExist=true lets the app create the database automatically
# the first time it starts (make sure XAMPP's MySQL/Apache service is running).
spring.datasource.url=jdbc:mysql://localhost:3308/vit_result_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run data.sql AFTER Hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
